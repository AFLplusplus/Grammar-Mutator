name: Grammar Mutator CI

# Pull requests test the branches. A push to stable tests the merge result.
on:
  push:
    branches: [stable]
  pull_request:

jobs:
  # Always run. The unit tests of the benchmark report script and of the
  # JavaScript seed tool run here. They also check that the committed benchmark
  # results match the script. A pull request of only results skips the build
  # jobs.
  benchmark-report:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Test the benchmark report script
      run: python3 -m unittest discover -s tests/python -p 'test_benchmark_report.py' -v
    - name: Test the JavaScript seed tool
      run: python3 -m unittest discover -s tests/python -p 'test_js_seeds.py' -v

  # Decide whether the change needs the build jobs. A pull request that changes
  # only documentation skips them. GitHub counts a skipped job as passed, so the
  # required checks (make-build, cmake-build) do not block such a pull request.
  # A push to stable always runs all jobs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check for changes other than documentation
      id: files
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        code=true
        if [ "$EVENT" = pull_request ]; then
          git diff --name-only "$BASE...$HEAD" > files.txt
          cat files.txt
          # Documentation: Markdown files, doc/, the license, and the list of
          # reformat commits for git blame
          if ! grep -qvE '(\.md$|^doc/|^LICENSE|^\.git-blame-ignore-revs$)' files.txt; then
            code=false
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

  format-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install the Python tools
      run: make -f GNUmakefile deps
    - name: Check the code format
      run: |
        make -f GNUmakefile code-format
        git diff --exit-code

  g4-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [make, cmake]
        grammar: [json, javascript]
    env:
      JSON_G4: grammars/g4/JSON.g4
      JS_G4: grammars/g4/javascript/JavaScriptLexer.g4 grammars/g4/javascript/JavaScriptParser.g4
      JS_SUPPORT: grammars/g4/javascript/Cpp

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Select the grammar files
      run: |
        if [ "${{ matrix.grammar }}" = json ]; then
          echo "G4_FILES=$JSON_G4" >> "$GITHUB_ENV"
        else
          echo "G4_FILES=$JS_G4" >> "$GITHUB_ENV"
          echo "G4_SUPPORT_DIR=$JS_SUPPORT" >> "$GITHUB_ENV"
        fi
    - name: Compile with make
      if: matrix.build == 'make'
      run: |
        make -f GNUmakefile GRAMMAR_FILE="$G4_FILES" G4_SUPPORT_DIR="${G4_SUPPORT_DIR:-}" -j$(nproc)
        echo "GENERATOR=./grammar_generator-${{ matrix.grammar }}" >> "$GITHUB_ENV"
    - name: Python unit tests
      # After the make build: the C++ compile test needs the ANTLR C++ runtime
      # source of the build. The variable makes the test fail, not skip, if
      # the runtime is missing.
      if: matrix.build == 'make' && matrix.grammar == 'json'
      env:
        REQUIRE_CPP_COMPILE_TEST: 1
      run: make -f GNUmakefile test-python
    - name: Compile with CMake
      if: matrix.build == 'cmake'
      run: |
        list=$(for f in $G4_FILES; do realpath "$f"; done | paste -sd ';')
        support=
        if [ -n "${G4_SUPPORT_DIR:-}" ]; then support="-DG4_SUPPORT_DIR=$(realpath "$G4_SUPPORT_DIR")"; fi
        cmake -S . -B build -DANTLR_JAR_LOCATION=$(realpath antlr-4.13.2-complete.jar) "-DGRAMMAR_FILE=$list" $support
        cmake --build build --parallel $(nproc)
        echo "BUILD_DIR=build" >> "$GITHUB_ENV"
        echo "GENERATOR=./build/src/grammar_generator-${{ matrix.grammar }}" >> "$GITHUB_ENV"
    - name: Matcher tests
      # The tests build their own grammars, so one grammar per build system is
      # enough
      if: matrix.grammar == 'json'
      run: tests/g4/run_matcher_tests.sh
    - name: grammar_parser tests
      run: tests/g4/test_grammar_parser.sh "${{ matrix.grammar }}"
    - name: afl_custom_queue_get tests
      run: tests/g4/test_queue_get.sh "${{ matrix.grammar }}"
    - name: Generate test cases
      run: |
        if [ "${{ matrix.grammar }}" = json ]; then count=200; else count=50; fi
        "$GENERATOR" "$count" 1000 seeds trees
        test "$(ls seeds | wc -l)" -eq "$count"
        test "$(ls trees | wc -l)" -eq "$count"
    - name: Check that the generated test cases are valid JSON
      if: matrix.grammar == 'json'
      run: |
        python3 - <<'EOF'
        import json, pathlib, sys
        seeds = sorted(pathlib.Path("seeds").iterdir())
        bad = []
        for seed in seeds:
            try:
                json.loads(seed.read_bytes())
            except ValueError:
                bad.append(seed.name)
        print(f"{len(seeds) - len(bad)} of {len(seeds)} test cases are valid JSON")
        sys.exit(1 if bad or not seeds else 0)
        EOF
    - name: Check that the parsed trees give the generated test cases again
      # Generation ignores the predicates of the JavaScript grammar, so ANTLR
      # rejects some generated test cases. Allow these skips for JavaScript.
      env:
        ALLOW_SKIPS: ${{ matrix.grammar == 'javascript' && '1' || '' }}
      run: tests/g4/roundtrip.sh "${{ matrix.grammar }}" seeds
    - name: Check that the parsed trees give the corpus files again
      run: tests/g4/roundtrip.sh "${{ matrix.grammar }}" "tests/g4/corpus/${{ matrix.grammar }}"
    - name: Benchmark program cache mode
      run: tests/benchmark/check_cache.sh "${{ matrix.grammar }}" "tests/g4/corpus/${{ matrix.grammar }}"

  cmake-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Create build directory
      run: |
        mkdir build
    - name: CMake
      run: |
        cd ./build
        cmake -DENABLE_TESTING=ON -DANTLR_JAR_LOCATION=$(realpath ../antlr-4.13.2-complete.jar) -DGRAMMAR_FILE=$(realpath ../grammars/ruby.json) ../
    - name: Compile
      run: cmake --build build --parallel $(nproc)
    - name: Unit testing
      run: |
        cd ./build
        make test
    - name: Benchmark program
      run: BUILD_DIR=build tests/benchmark/test_benchmark.sh ruby
    - name: Benchmark program under Valgrind
      run: |
        build/src/grammar_generator-ruby 20 1000 bench-seeds bench-trees 1
        valgrind --leak-check=full --errors-for-leak-kinds=definite \
          --error-exitcode=99 build/src/benchmark/benchmark-ruby digest \
          -n 20 -t 10 bench-seeds
    - name: Valgrind memcheck on unit testing
      run: |
        cd ./build
        make test_memcheck

  # The parse time limit of a JSON grammar build stops a slow parse. The test
  # grammar is ambiguous, so the parse time of a long list grows exponentially.
  json-parse-limit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Build the ambiguous test grammar
      run: |
        cmake -S . -B build -DANTLR_JAR_LOCATION=$(realpath antlr-4.13.2-complete.jar) -DGRAMMAR_FILE=$(realpath tests/json/ambiguous_list.json)
        cmake --build build --parallel $(nproc)
    - name: Check the parse time limit
      run: BUILD_DIR=build tests/json/test_parse_limit.sh ambiguous
    # A stopped parse must free its memory. The runtime does not free one
    # prediction set on an exception, so the shim does it (parse_clock.h).
    - name: Check the parse time limit under Valgrind
      run: |
        VALGRIND="valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=99" \
          BUILD_DIR=build tests/json/test_parse_limit.sh ambiguous

  make-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Compile
      run: |
        make -f GNUmakefile ENABLE_TESTING=1 GRAMMAR_FILE=grammars/ruby.json ANTLR_JAR_LOCATION=./antlr-4.13.2-complete.jar -j$(nproc)
    - name: Unit testing
      run: |
        make -f GNUmakefile test
    - name: Benchmark program
      run: tests/benchmark/test_benchmark.sh ruby
    - name: Valgrind memcheck on unit testing
      run: |
        make -f GNUmakefile test_memcheck
