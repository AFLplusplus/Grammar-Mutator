name: Grammar Mutator CI

# Pull requests test the branches. A push to stable tests the merge result.
on:
  push:
    branches: [stable]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install the Python tools
      run: make -f GNUmakefile deps
    - name: Check the code format
      run: |
        make -f GNUmakefile code-format
        git diff --exit-code

  g4-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [make, cmake]
        grammar: [json, javascript]
    env:
      JSON_G4: grammars/g4/JSON.g4
      JS_G4: grammars/g4/javascript/JavaScriptLexer.g4 grammars/g4/javascript/JavaScriptParser.g4
      JS_SUPPORT: grammars/g4/javascript/Python3

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Python unit tests
      if: matrix.build == 'make' && matrix.grammar == 'json'
      run: make -f GNUmakefile test-python
    - name: Select the grammar files
      run: |
        if [ "${{ matrix.grammar }}" = json ]; then
          echo "G4_FILES=$JSON_G4" >> "$GITHUB_ENV"
        else
          echo "G4_FILES=$JS_G4" >> "$GITHUB_ENV"
          echo "G4_SUPPORT_DIR=$JS_SUPPORT" >> "$GITHUB_ENV"
        fi
    - name: Compile with make
      if: matrix.build == 'make'
      run: |
        make -f GNUmakefile GRAMMAR_FILE="$G4_FILES" G4_SUPPORT_DIR="${G4_SUPPORT_DIR:-}" -j$(nproc)
        echo "GENERATOR=./grammar_generator-${{ matrix.grammar }}" >> "$GITHUB_ENV"
    - name: Compile with CMake
      if: matrix.build == 'cmake'
      run: |
        list=$(for f in $G4_FILES; do realpath "$f"; done | paste -sd ';')
        support=
        if [ -n "${G4_SUPPORT_DIR:-}" ]; then support="-DG4_SUPPORT_DIR=$(realpath "$G4_SUPPORT_DIR")"; fi
        cmake -S . -B build -DANTLR_JAR_LOCATION=$(realpath antlr-4.13.2-complete.jar) "-DGRAMMAR_FILE=$list" $support
        cmake --build build --parallel $(nproc)
        echo "BUILD_DIR=build" >> "$GITHUB_ENV"
        echo "GENERATOR=./build/src/grammar_generator-${{ matrix.grammar }}" >> "$GITHUB_ENV"
    - name: Generate test cases
      run: |
        if [ "${{ matrix.grammar }}" = json ]; then count=200; else count=50; fi
        "$GENERATOR" "$count" 1000 seeds trees
        test "$(ls seeds | wc -l)" -eq "$count"
        test "$(ls trees | wc -l)" -eq "$count"
    - name: Check that the generated test cases are valid JSON
      if: matrix.grammar == 'json'
      run: |
        python3 - <<'EOF'
        import json, pathlib, sys
        seeds = sorted(pathlib.Path("seeds").iterdir())
        bad = []
        for seed in seeds:
            try:
                json.loads(seed.read_bytes())
            except ValueError:
                bad.append(seed.name)
        print(f"{len(seeds) - len(bad)} of {len(seeds)} test cases are valid JSON")
        sys.exit(1 if bad or not seeds else 0)
        EOF
    - name: Check that the parsed trees give the generated test cases again
      # Generation ignores the predicates of the JavaScript grammar, so ANTLR
      # rejects some generated test cases. Allow these skips for JavaScript.
      env:
        ALLOW_SKIPS: ${{ matrix.grammar == 'javascript' && '1' || '' }}
      run: tests/g4/roundtrip.sh "${{ matrix.grammar }}" seeds
    - name: Check that the parsed trees give the corpus files again
      run: tests/g4/roundtrip.sh "${{ matrix.grammar }}" "tests/g4/corpus/${{ matrix.grammar }}"

  cmake-build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Create build directory
      run: |
        mkdir build
    - name: CMake
      run: |
        cd ./build
        cmake -DENABLE_TESTING=ON -DANTLR_JAR_LOCATION=$(realpath ../antlr-4.13.2-complete.jar) -DGRAMMAR_FILE=$(realpath ../grammars/ruby.json) ../
    - name: Compile
      run: cmake --build build --parallel $(nproc)
    - name: Unit testing
      run: |
        cd ./build
        make test
    - name: Valgrind memcheck on unit testing
      run: |
        cd ./build
        make test_memcheck

  make-build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Compile
      run: |
        make -f GNUmakefile ENABLE_TESTING=1 GRAMMAR_FILE=grammars/ruby.json ANTLR_JAR_LOCATION=./antlr-4.13.2-complete.jar -j$(nproc)
    - name: Unit testing
      run: |
        make -f GNUmakefile test
    - name: Valgrind memcheck on unit testing
      run: |
        make -f GNUmakefile test_memcheck
