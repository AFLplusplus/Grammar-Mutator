name: Grammar Mutator CI

# Pull requests test the branches. A push to stable tests the merge result.
on:
  push:
    branches: [stable]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install clang-format
      run: make -f GNUmakefile format-deps
    - name: Check the code format
      run: |
        make -f GNUmakefile code-format
        git diff --exit-code

  cmake-build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Create build directory
      run: |
        mkdir build
    - name: CMake
      run: |
        cd ./build
        cmake -DENABLE_TESTING=ON -DANTLR_JAR_LOCATION=$(realpath ../antlr-4.8-complete.jar) -DGRAMMAR_FILE=$(realpath ../grammars/ruby.json) ../
    - name: Compile
      run: cmake --build build --parallel $(nproc)
    - name: Unit testing
      run: |
        cd ./build
        make test
    - name: Valgrind memcheck on unit testing
      run: |
        cd ./build
        make test_memcheck

  make-build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        bash .github/workflows/setup-deps.sh
    - name: Compile
      run: |
        make -f GNUmakefile ENABLE_TESTING=1 GRAMMAR_FILE=grammars/ruby.json ANTLR_JAR_LOCATION=./antlr-4.8-complete.jar -j$(nproc)
    - name: Unit testing
      run: |
        make -f GNUmakefile test
    - name: Valgrind memcheck on unit testing
      run: |
        make -f GNUmakefile test_memcheck
