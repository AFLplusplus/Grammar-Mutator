# The squash merge uses the pull request title as the commit message.
# Release Please reads these commit messages, so the title must follow
# Conventional Commits.
name: PR Title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
    - uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          perf
          refactor
          docs
          test
          build
          ci
          chore
          style
          revert
        requireScope: false
