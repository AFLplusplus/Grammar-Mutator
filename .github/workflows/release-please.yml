# Each push to stable updates the release pull request. When you merge the
# release pull request, this workflow tags the release and publishes it.
name: Release Please

on:
  push:
    branches: [stable]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
    - uses: googleapis/release-please-action@v5
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
